name: データ同期

# 公式ページから日程・結果・順位表を取り込み、変化があればコミットする。
# アプリは data/*.json を実行時に読むので、デプロイは不要。
on:
  schedule:
    # 30分おき。混み合う毎時0分・30分を避けると間引かれにくい。
    # （GitHub の都合で実際には数時間おきになることがある）
    # Public リポジトリなので Actions の実行時間は無料。
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  # 試合中は長く動くので、次の実行で置き換える
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 公式ページから取得（試合中は得点者を追う）
        run: node scripts/sync.mjs --watch
        timeout-minutes: 25

      - name: 変化があればコミット
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: 公式ページから同期 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          git push
